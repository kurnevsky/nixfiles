[package]
name = "fuzzy-matcher"
version = "0.0.1"
authors = ["Evgeny Kurnevsky <kurnevsky@gmail.com>"]
license = "GPL-3.0+"
edition = "2021"

[lib]
path = "src/lib.rs"
name = "fuzzy_matcher_el"
crate-type = ["cdylib"]

[dependencies]
emacs = { git = "https://github.com/kurnevsky/emacs-module-rs.git", rev = "9d88c663fbe487a14af0fff09be74b0afa707054", features = [ "utf-8-validation" ] }
nucleo-matcher = "0.3"
lazy_static = "1.5"

[profile.release]
opt-level = 3
lto = true
debug = false
codegen-units = 1
